<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a3a8a"/>
      <stop offset="100%" stop-color="#061228"/>
    </radialGradient>
    <radialGradient id="goldG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#b8820a"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Gold outer ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#c8952a" stroke-width="1.5"/>

  <!-- Shield -->
  <path d="M16,4 L26,7.5 L26,17 Q26,24 16,28 Q6,24 6,17 L6,7.5 Z"
    fill="#0d2757" stroke="#c8952a" stroke-width="1"/>

  <!-- Blue top band on shield -->
  <path d="M16,4 L26,7.5 L26,11 L6,11 L6,7.5 Z" fill="#1455b8"/>

  <!-- Falcon wings -->
  <path d="M16,16 Q10,13 5,15 Q9,17 13,18 Z" fill="#4a7fd4"/>
  <path d="M16,16 Q22,13 27,15 Q23,17 19,18 Z" fill="#4a7fd4"/>

  <!-- Falcon body -->
  <ellipse cx="16" cy="18" rx="3.5" ry="4.5" fill="#0d2757"/>
  <!-- Falcon head -->
  <circle cx="16" cy="13.5" r="3" fill="#0d2757"/>
  <!-- Beak -->
  <path d="M18,13.5 L21,14.5 L18.5,15.5 Z" fill="#c8952a"/>
  <!-- Eye -->
  <circle cx="17.5" cy="13" r="0.9" fill="#c8952a"/>

  <!-- Torch flame -->
  <ellipse cx="16" cy="11" rx="2" ry="3" fill="#ff9900" opacity="0.9"/>
  <ellipse cx="16" cy="11.5" rx="1.2" ry="2" fill="#ffde00"/>

  <!-- 6 small stars around ring -->
  <g fill="#c8952a" opacity="0.9">
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(0,16,16)"/>
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(60,16,16)"/>
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(120,16,16)"/>
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(180,16,16)"/>
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(240,16,16)"/>
    <polygon points="16,1.5 16.5,3 18,3 16.8,3.9 17.3,5.4 16,4.5 14.7,5.4 15.2,3.9 14,3 15.5,3" transform="rotate(300,16,16)"/>
  </g>
</svg>
